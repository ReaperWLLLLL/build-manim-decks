name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install fast-test dependencies
        run: >-
          python -m pip install
          "PyYAML>=6.0" "Pillow>=10.0" "pypdf>=6.0,<7"
          "python-pptx>=1.0" "pytest>=8.0"

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Run tests
        run: python -m pytest -q
