schema_version: "0.1"
project:
  title: "{{PROJECT_TITLE}}"
  kind: "research-talk"
  language: "en"
  audience: "Researchers familiar with the broad field"
  duration_minutes: 2
  aspect_ratio: "16:9"
  theme: "scientific-dark"
  source_files:
    - "source/example-outline.md"
narrative:
  thesis: "A clearly visualized mechanism can make a research claim easier to evaluate."
  takeaways:
    - "The talk should connect one mechanism to one evidence-backed conclusion."
    - "Animation should reveal relationships in narration order."
slides:
  - id: "s01"
    section: "opening"
    title: "{{PROJECT_TITLE}}"
    purpose: "open"
    claim: "The audience should know the question and why it matters."
    duration_seconds: 30
    source_refs: []
    scene_class: "Opening"
    visual_mode: "manim"
    notes: |
      Start with a familiar tension: data centers need reliable electricity, while renewable
      generation varies across time and place. Ask whether computing must remain a fixed
      demand, or whether flexible workloads can follow cleaner power. State the thesis:
      when scheduling respects service constraints, computing can become an adjustable
      grid load. Preview that the talk will connect this mechanism to evidence and define
      the boundary of the conclusion.
    beats:
      - id: "b1"
        narration: "Begin with the research question."
        action: "Reveal the title and a concise thesis line."
    qa:
      must_show: ["title", "thesis"]
      avoid: ["dense subtitle"]
  - id: "s02"
    section: "core"
    title: "One mechanism connects the question to an observable result"
    purpose: "explain"
    claim: "The mechanism should be revealed before its evidence is evaluated."
    duration_seconds: 60
    source_refs: ["src-core-01"]
    scene_class: "CoreMechanism"
    visual_mode: "manim"
    notes: |
      First establish the initial state. Jobs arrive with deadlines, resource requirements,
      and different degrees of flexibility. A conventional scheduler treats electricity as
      continuously available and optimizes only computing objectives. Now introduce the
      mechanism: attach a time- and location-specific carbon signal to the feasible execution
      slots. Flexible jobs may move toward cleaner slots, while inflexible jobs remain fixed.
      The service boundary does not move; it is a constraint, not a target that can be traded
      away. Reveal the result only after that logic is visible. The observable change should
      therefore be attributed to scheduling flexibility under constraints, rather than to an
      unsupported claim that every workload can follow renewable generation. When presenting
      empirical evidence, name the dataset, baseline, system boundary, and uncertainty before
      emphasizing the improvement. This order lets the audience evaluate both the mechanism
      and the strength of the evidence.
    beats:
      - id: "b1"
        narration: "Establish the initial state and its constraint."
        action: "Create two labeled states connected by a muted arrow."
      - id: "b2"
        narration: "Reveal the mechanism that changes the observable outcome."
        action: "Transform the arrow, highlight the mechanism, then reveal the result."
    qa:
      must_show: ["initial state", "mechanism", "result"]
      avoid: ["simultaneous unrelated motion"]
  - id: "s03"
    section: "closing"
    title: "The conclusion is useful only within its evidence boundary"
    purpose: "close"
    claim: "End with the contribution, evidence, and limitation."
    duration_seconds: 30
    source_refs: ["src-core-01"]
    scene_class: "Closing"
    visual_mode: "manim"
    notes: |
      Return to the thesis with a precise boundary. The contribution is a scheduling view of
      computing as a flexible grid load. The evidence must show a measured improvement against
      a named baseline while preserving service requirements. The limitation is equally
      important: benefit depends on workload flexibility, forecast quality, and available clean
      power. Close by separating what the study demonstrates from what future deployment still
      needs to validate.
    beats:
      - id: "b1"
        narration: "Return to the thesis with its evidence boundary."
        action: "Reveal contribution, evidence, and limitation as three aligned lines."
    qa:
      must_show: ["contribution", "evidence", "limitation"]
      avoid: ["thank-you-only ending"]
outputs:
  html: "deliverables/presentation.html"
  pptx: "deliverables/presentation.pptx"
  pdf: "deliverables/presentation.pdf"
  speech: "deliverables/speech.md"
